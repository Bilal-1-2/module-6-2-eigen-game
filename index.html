<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation System</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #111;
        font-family: Arial, sans-serif;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        text-align: center;
      }

      h1 {
        color: #ff6600;
        margin-bottom: 10px;
      }

      canvas {
        display: block;
        margin: 20px auto;
        border: 2px solid #333;
        background: #ffffff;
      }

      .controls {
        margin: 20px 0;
      }

      button {
        padding: 15px 30px;
        margin: 10px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.2s;
      }

      #explosionBtn {
        background: #e74c3c;
        color: white;
      }

      #explosionBtn:hover {
        background: #c0392b;
      }

      #flameBtn {
        background: #ff9900;
        color: white;
      }

      #flameBtn:hover {
        background: #e68a00;
      }

      #clearBtn {
        background: #7f8c8d;
        color: white;
      }

      #clearBtn:hover {
        background: #95a5a6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎮 Animation System</h1>
      <p style="color: #ccc">Multiple animations running smoothly together</p>

      <canvas id="gameCanvas" width="800" height="500"></canvas>

      <div class="controls">
        <button id="explosionBtn" onclick="createExplosion()">
          Create Explosion
        </button>
        <button onclick="createSoldier(50, 450)">Add Soldier (WSAD)</button>
        <!-- Add this button to your controls section -->
        <button onclick="toggleSoldierRun()">Toggle Run/Walk</button>
        <button id="flameBtn" onclick="createFlame()">Create Flame</button>
        <button id="clearBtn" onclick="AnimationManager.clearAll()">
          Clear All
        </button>
        <button onclick="damageCurrentSoldier(10)">
          Damage Soldier (-10 HP)
        </button>
        <button onclick="damageCurrentSoldier(25)">
          Heavy Damage (-25 HP)
        </button>
        <button onclick="window.currentSoldier.health = 100">
          Heal Soldier
        </button>
      </div>
    </div>

    <!-- First: Manager -->
    <script src="assets/JS/animations.js"></script>
    <!-- Second: Animation 1 -->
    <script src="assets/JS/explosion.js"></script>
    <!-- Second: Animation 2 -->
    <script src="assets/JS/flame.js"></script>
    <!-- Third: Animation 3 -->
    <script src="assets/JS/soldier.js"></script>
  </body>
</html>
